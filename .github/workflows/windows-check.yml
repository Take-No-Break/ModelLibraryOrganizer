name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: python run_tests.py
      - run: python -m PyInstaller --noconfirm ModelLibraryOrganizer.spec
      - name: Check packaged startup with fresh settings
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'organizer-fresh'
          $process = Start-Process -FilePath '.\dist\ModelLibraryOrganizer\ModelLibraryOrganizer.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged startup failed' }
